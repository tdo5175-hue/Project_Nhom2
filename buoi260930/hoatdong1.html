<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoạt Động 1 - Flexbox Căn Giữa Toàn Màn Hình (100vh)</title>
    <!-- Nhúng CSS định dạng External -->
    <link rel="stylesheet" href="css/hoatdong1.css">
</head>
<body>

    <!-- 
      Thẻ có class là "container" 
      Được thiết lập height: 100vh và dùng Flexbox để căn giữa hoàn toàn theo cả chiều dọc & chiều ngang 
    -->
    <div class="container">
        <main class="center-card">
            <div class="badge">
                <span class="badge-dot"></span>
                <span>Flexbox UI/UX Design</span>
            </div>

            <h1>Căn Giữa Hoàn Hảo</h1>
            <p>
                Thẻ <code>.container</code> được thiết lập <strong>height: 100vh</strong> kết hợp cùng các thuộc tính Flexbox để định vị nội dung chính xác tại tâm màn hình.
            </p>

            <div class="code-preview">
                .container {<br>
                &nbsp;&nbsp;height: <span>100vh</span>;<br>
                &nbsp;&nbsp;display: <span>flex</span>;<br>
                &nbsp;&nbsp;justify-content: <span>center</span>;<br>
                &nbsp;&nbsp;align-items: <span>center</span>;<br>
                }
            </div>

            <button type="button" class="btn-action">Trải Nghiệm Ngay</button>
        </main>
    </div>

</body>
</html>
