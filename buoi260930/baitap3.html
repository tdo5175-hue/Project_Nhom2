<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập 3: Thư Viện Ảnh Masonry (CSS Grid) - Project Nhóm 2</title>
    <!-- Nhúng CSS External -->
    <link rel="stylesheet" href="css/baitap3.css">
</head>
<body>

    <div class="gallery-wrapper">
        <header class="gallery-header">
            <span class="badge">CSS Grid Gallery</span>
            <h1>Bộ Sưu Tập Ảnh Nghệ Thuật (Masonry-like)</h1>
            <p>Sử dụng <code>grid-column: span</code> và <code>grid-row: span</code> kết hợp <code>gap: 15px</code> đồng nhất theo phong cách Pinterest.</p>
        </header>

        <!-- 
          THƯ VIỆN ẢNH VỚI 9 Ô ẢNH TO NHỎ ĐAN XEN NGHỆ THUẬT:
          - Gap đồng nhất: 15px
          - grid-auto-flow: dense
        -->
        <main class="photo-gallery">

            <!-- Ảnh 1: Ô lớn nổi bật (span 2 x span 2) -->
            <figure class="gallery-item item-1">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80" alt="Vi mạch công nghệ">
                <figcaption class="overlay">
                    <h3>Công Nghệ Lõi</h3>
                    <p>span 2 cột x span 2 hàng</p>
                </figcaption>
            </figure>

            <!-- Ảnh 2: Ô vuông chuẩn (span 1 x span 1) -->
            <figure class="gallery-item item-2">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80" alt="Bãi biển hoàng hôn">
                <figcaption class="overlay">
                    <h3>Bình Yên Biển Vắng</h3>
                    <p>span 1 cột x span 1 hàng</p>
                </figcaption>
            </figure>

            <!-- Ảnh 3: Ô dọc đứng (span 1 x span 2) -->
            <figure class="gallery-item item-3">
                <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=500&q=80" alt="Kiến trúc hiện đại">
                <figcaption class="overlay">
                    <h3>Kiến Trúc Tương Lai</h3>
                    <p>span 1 cột x span 2 hàng</p>
                </figcaption>
            </figure>

            <!-- Ảnh 4: Ô vuông chuẩn (span 1 x span 1) -->
            <figure class="gallery-item item-4">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=500&q=80" alt="Không gian vũ trụ">
                <figcaption class="overlay">
                    <h3>Khám Phá Thiên Hà</h3>
                    <p>span 1 cột x span 1 hàng</p>
                </figcaption>
            </figure>

            <!-- Ảnh 5: Ô chữ nhật ngang (span 2 x span 1) -->
            <figure class="gallery-item item-5">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" alt="Sương mù rừng thông">
                <figcaption class="overlay">
                    <h3>Rừng Xanh Trong Sương</h3>
                    <p>span 2 cột x span 1 hàng</p>
                </figcaption>
            </figure>

            <!-- Ảnh 6: Ô dọc đứng (span 1 x span 2) -->
            <figure class="gallery-item item-6">
                <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=500&q=80" alt="Nhiếp ảnh gia">
                <figcaption class="overlay">
                    <h3>Góc Nhìn Sáng Tạo</h3>
                    <p>span 1 cột x span 2 hàng</p>
                </figcaption>
            </figure>

            <!-- Ảnh 7: Ô vuông chuẩn (span 1 x span 1) -->
            <figure class="gallery-item item-7">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=500&q=80" alt="Lập trình viên">
                <figcaption class="overlay">
                    <h3>Code & Sáng Tạo</h3>
                    <p>span 1 cột x span 1 hàng</p>
                </figcaption>
            </figure>

            <!-- Ảnh 8: Ô lớn nổi bật (span 2 x span 2) -->
            <figure class="gallery-item item-8">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Thác nước hùng vĩ">
                <figcaption class="overlay">
                    <h3>Tuyệt Tác Thiên Nhiên</h3>
                    <p>span 2 cột x span 2 hàng</p>
                </figcaption>
            </figure>

            <!-- Ảnh 9: Ô chữ nhật ngang (span 2 x span 1) -->
            <figure class="gallery-item item-9">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80" alt="Bầu trời đêm đầy sao">
                <figcaption class="overlay">
                    <h3>Dãy Núi Dưới Ánh Sao</h3>
                    <p>span 2 cột x span 1 hàng</p>
                </figcaption>
            </figure>

        </main>
    </div>

</body>
</html>
